# Render: dynamic port injected via PORT env var
server.port=${PORT:8080}

# Render: trust the proxy/load balancer so real client IP is visible
server.forward-headers-strategy=framework

spring.main.lazy-initialization=false
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

games.blackjack.cleanup-delay-ms=60000
games.minesweeper.cleanup-delay-ms=60000
games.2048.cleanup-delay-ms=60000

# CORS origins are NOT configured as a Spring property (a games.cors.allowed-origins
# entry existed here but was never read by any consumer; removed in Step 5b).
# RateLimitFilter reads the GAMES_CORS_ALLOWED_ORIGINS env var directly.
# Example env value: https://my-frontend.onrender.com,http://localhost:5173

games.idempotency.cleanup-delay-ms=600000

games.rate-limit.max-cache-entries=10000
games.rate-limit.bucket-idle-ms=300000
games.rate-limit.trust-forwarded-for=${GAMES_RATE_LIMIT_TRUST_XFF:false}

# Correlation logging: %5p [%X{requestId}] injects the MDC requestId set by CorrelationIdFilter
logging.pattern.level=%5p [%X{requestId}]

# Actuator Endpoint Config
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true

# Step 6g B: /actuator/info build info. build.version/build.time/build.timestamp
# are injected by the spring-boot-maven-plugin build-info goal at package time
# (games-backend/pom.xml), so "which commit is deployed?" has a stable answer.
# info.app.name is a plain property; management.info.env.enabled exposes the
# active environment (this app holds no secret env vars on Render - PORT,
# GAMES_CORS_ALLOWED_ORIGINS, GAMES_RATE_LIMIT_TRUST_XFF).
info.app.name=games-backend
management.info.env.enabled=true
