# Render: dynamic port injected via PORT env var
server.port=${PORT:8080}

# Render: trust the proxy/load balancer so real client IP is visible
server.forward-headers-strategy=framework

spring.main.lazy-initialization=false
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

games.blackjack.cleanup-delay-ms=60000
games.minesweeper.cleanup-delay-ms=60000
games.2048.cleanup-delay-ms=60000

# CORS Origins — override via GAMES_CORS_ALLOWED_ORIGINS env var on Render
# Example: https://my-frontend.onrender.com,http://localhost:5173
games.cors.allowed-origins=${GAMES_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://localhost:80}

# Actuator Endpoint Config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
